name: dependency_update_check
on:
  schedule:
    - cron: "0 0 15 */3 *"
  workflow_dispatch:

jobs:
  check-repository:
    runs-on: ubuntu-latest
    outputs:
      is_remote_main: ${{ steps.check.outputs.is_remote_main }}
    steps:
      - name: Check repository
        id: check
        run: |
          if [ "$GITHUB_REPOSITORY" = "scribe-org/scri.be" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_remote_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_remote_main=false" >> "$GITHUB_OUTPUT"
            echo "::warning::This workflow should only run in scribe-org/scri.be repository."
          fi

  update_dependencies:
    needs: check-repository
    if: needs.check-repository.outputs.is_remote_main == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    # Note: Update the following if there are dependencies that can't be upgraded.
    env:
      # Note: Set these values in yarn.config.cjs to enforce the version constraints.
      FRONTEND_MAX_VERSIONS: '{"typescript": "6.0.3"}'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node Environment
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # MARK: Initialize

      - name: Initialize Report
        run: |
          echo "# Dependency Update Report - $(date '+%B %d, %Y') 🤖⬆️" > reports.md
          echo "" >> reports.md
          echo "> [!NOTE]" >> reports.md
          echo "> All tests should pass for PRs that are updating dependencies. See the [testing section of the contributing guide](https://github.com/scribe-org/scri.be/blob/main/CONTRIBUTING.md#testing-) for more information on how to run tests before your PR. Please also limit the number of dependencies that are being updated in each PR to make it easy for maintainers to merge." >> reports.md

          FRONTEND_CAPS=$(echo "$FRONTEND_MAX_VERSIONS" | jq -r 'to_entries | map("\(.key)@\(.value)") | join(", ")')

          if [ -n "$FRONTEND_CAPS" ]; then
            echo "" >> reports.md
            echo "> [!WARNING]" >> reports.md
            echo "> Note that the following dependencies have maximum versions set in the [dependency_update_check.yaml](https://github.com/scribe-org/scri.be/blob/main/.github/workflows/dependency_update_check.yaml) workflow:" >> reports.md
            echo ">" >> reports.md
            echo "> - Frontend: $FRONTEND_CAPS" >> reports.md
            echo ">" >> reports.md
            echo "> Please check whether maximum version restrictions can be removed and rerun the workflow without them if they can be." >> reports.md
            echo "" >> reports.md
          fi

          echo "## Available Dependency Updates" >> reports.md
          echo "" >> reports.md
          echo "| Package Name | Old Version | New Available Version | Type |" >> reports.md
          echo "|--------------|-------------|-----------------------|------|" >> reports.md

      # MARK: Frontend

      - name: Setup Yarn
        working-directory: ./frontend
        continue-on-error: false
        run: |
          sudo corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install Frontend Dependencies
        id: install-frontend
        working-directory: ./frontend
        continue-on-error: false
        run: |
          rm -rf .yarn .pnp.* yarn.lock node_modules
          yarn set version 4.12.0
          yarn install --no-immutable

      - name: Update Frontend Dependencies
        id: frontend-updates
        working-directory: ./frontend
        continue-on-error: false
        run: |
          cp package.json package.old.json
          yarn add npm-check-updates

          chmod +x ../utils/dependency_update_check/compare_frontend_versions.ts

          REJECT_LIST=$(echo "$FRONTEND_MAX_VERSIONS" | jq -r 'keys | join(",")')

          # Note: We don't install versions that are younger than seven days (three to seven days is conservative age).
          if [ -n "$REJECT_LIST" ] && [ "$REJECT_LIST" != "null" ]; then
            yarn ncu -u -p yarn -c 7d -x "$REJECT_LIST"  # npm-check-updates
          else
            yarn ncu -u -p yarn -c 7d
          fi

          # Attn: Max versions are set via the yarn.config.cjs file.
          # See: https://yarnpkg.com/features/constraints
          yarn constraints || true  # view constraints for logging
          yarn constraints --fix

          # Sync node_modules with the newly updated package.json.
          yarn install --no-immutable

          node ../utils/dependency_update_check/compare_frontend_versions.ts | sed 's/- \(.*\): \(.*\) → \(.*\)/| \1 | \2 | \3 | Frontend |/' >> ../reports.md || echo "No frontend changes found" >> ../reports.md

      # MARK: Run Tests

      - name: Run Frontend Tests
        id: frontend-tests
        working-directory: ./frontend
        continue-on-error: true
        run: |
          echo "" >> ../reports.md
          echo "## Frontend Tests" >> ../reports.md

          # Note: Don't check formatting.
          # echo "compare_versions.js" >> ../.prettierignore
          # echo -e "\n### Prettier Results\n" >> ../reports.md
          # echo "\`\`\`" >> ../reports.md
          # yarn prettier . --check --config ../.prettierrc --ignore-path ../.prettierignore 2>&1 | tee -a ../reports.md || true
          # echo "\`\`\`" >> ../reports.md

          echo -e "\n### ESLint Results\n" >> ../reports.md
          echo "\`\`\`" >> ../reports.md
          yarn lint 2>&1 | tee -a ../reports.md || true
          echo "\`\`\`" >> ../reports.md

          echo -e "\n### Type Check Results\n" >> ../reports.md
          echo "\`\`\`" >> ../reports.md
          yarn typecheck 2>&1 | tee -a ../reports.md || true
          echo "\`\`\`" >> ../reports.md

          # Note: No Vitest tests for now.
          # echo -e "\n### Vitest Results\n" >> ../reports.md
          # echo "\`\`\`" >> ../reports.md
          # yarn test --reporter=dot --silent='passed-only' --no-color 2>&1 | tee -a ../reports.md || true
          # echo "\`\`\`" >> ../reports.md

      # MARK: Create Issue

      - name: Set date
        id: date
        run: echo "REPORT_DATE=$(date '+%B %d, %Y')" >> $GITHUB_ENV

      - name: Create GitHub Issue
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "[Multiple Assignees Possible] Dependency Update Report - ${{ env.REPORT_DATE }} 🤖⬆️"
          content-filepath: reports.md
          labels: |
            dependencies
            help wanted
            good first issue
